# A UI5 CLI project of type "module": no library around it, just files served
# under a namespace. Any UI5 app that has this package in its dependencies
# gets its path served by `ui5 serve` and copied by `ui5 build --all` - no
# resourceRoots in a standalone index.html (see README for the launchpad).
#
# Only the control lives here. The abap2UI5 frontend it wraps - the z2ui5
# component under /resources/z2ui5/ - is the dependency @abap2ui5/frontend,
# a UI5 module of its own that the tooling picks up the same way.
specVersion: "4.0"
type: module
metadata:
  name: "@abap2ui5/embed"
resources:
  configuration:
    paths:
      /resources/z2ui5/reuse/: ./src/
