# A UI5 CLI project of type "module": no library around it, just the control
# served under a path of the app. Any UI5 app that has this package in its
# dependencies gets it served by `ui5 serve`, and copied into its build by
# `ui5 build` once the app names it under builder.settings.includeDependency.
#
# thirdparty/, not resources/: an app deployed to an ABAP system answers every
# <app>/resources/ path from the UI5 library of the system, so the control
# would never be found there. The app registers the namespace with a relative
# resourceRoot ("z2ui5.reuse": "./thirdparty/z2ui5/reuse/"), which holds in a
# standalone page and in the launchpad alike.
specVersion: "4.0"
type: module
metadata:
  name: "@abap2ui5/reuse-custom-control"
resources:
  configuration:
    paths:
      /thirdparty/z2ui5/reuse/: ./src/
