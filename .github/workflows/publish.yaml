name: publish

# Publishes @abap2ui5/reuse-custom-control when a GitHub release is published.
# The package version is the one in packages/reuse-custom-control/package.json
# - bump it in the pull request that prepares the release, and tag the release
# v<version>; the job refuses a tag that says something else.
#
# npm needs NPM_TOKEN: a token of an npm user allowed to publish to the
# @abap2ui5 scope. Without it the job stops with a message and publishes
# nothing. --provenance links the published version to this workflow run.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the token and the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set - nothing is published"
            exit 1
          fi
          VERSION=$(node -p "require('./packages/reuse-custom-control/package.json').version")
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace packages/reuse-custom-control --provenance --access public
