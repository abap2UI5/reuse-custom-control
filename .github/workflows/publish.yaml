name: publish

# Publishes the npm package when a GitHub release is published. The package
# version is the one in the package's package.json - bump it in the pull
# request that prepares the release, and tag the release v<version>; the job
# refuses a tag that says something else.
#
# Trusted publishing (OIDC) is how it publishes: no NPM_TOKEN to leak or
# rotate, and npm records a provenance attestation tying the tarball to this
# run and commit. `id-token: write` below is what mints the token, and the
# package's Settings -> Trusted Publisher on npmjs.com has to name this
# repository and this workflow file (`publish.yaml`).
#
# That setting can only be made for a package that ALREADY EXISTS, so the
# very first version is published by hand, once, after `npm login`:
#
#     npm ci && npm run build
#     npm publish --workspace packages/<the package> --access public
#
# (no --provenance there: npm generates an attestation only from a supported
# CI and aborts anywhere else - the bootstrap version ships without it, every
# release this workflow cuts has it). Until that has happened, a failed
# publish here is expected, not an error:
#
#   package not on the registry yet  -> a warning naming the bootstrap, the
#                                       run stays green
#   package on the registry          -> the bootstrap is done, so a failed
#                                       publish is a failed publish
#
# A stored NPM_TOKEN still works and takes precedence - the fallback for an
# organisation that has not moved to trusted publishing.

on:
  release:
    types: [published]
  # Everything except the publish - the same checks, the same tarball
  # listing, no registry write.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, which has no OIDC support - it would fall
      # through to asking for a token and fail confusingly. Trusted publishing
      # needs 11.5.1 or newer. PINNED, not @latest: this is the one job in the
      # repository that holds a publishing identity, and @latest hands whatever
      # npm published this morning the right to run inside it. The same pin as
      # abap2UI5/linter and abap2UI5/abap2UI5 - raise them together.
      - name: Use an npm that can publish via OIDC
        run: npm install -g npm@12.0.2

      # the one package under packages/ - its directory, name and version
      - id: pkg
        run: |
          PKG_DIR="$(ls -d packages/*/ | head -n1 | sed 's:/$::')"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./$PKG_DIR/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$PKG_DIR/package.json').version")" >> "$GITHUB_OUTPUT"

      # The tag is the version claim; package.json is what gets published.
      # Catching a mismatch here costs a minute, catching it afterwards costs
      # a burned version number - npm never lets one be reused.
      - name: The release tag and the package version agree
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # what the tarball will contain, in the log, before it is immutable
      - run: npm run pack:check

      - name: Publish
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -u
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "publishing $NAME@$VERSION with NPM_TOKEN"
          else
            echo "publishing $NAME@$VERSION via trusted publishing (OIDC)"
          fi
          if npm publish --workspace "$PKG_DIR" --provenance --access public; then
            echo "published $NAME@$VERSION"
            exit 0
          fi
          if npm view "$NAME" version >/dev/null 2>&1; then
            echo "::error::$NAME is on the registry, but publishing $VERSION failed - see the npm output above (a version that already exists? the trusted publisher not pointing at this workflow?)"
            exit 1
          fi
          echo "::warning::$NAME@$VERSION was NOT published: the package does not exist on the registry yet, and trusted publishing can only be configured for one that does. Bootstrap it once by hand (the header of this workflow), point the package's Trusted Publisher at this repository and publish.yaml, then every release publishes here."

      - name: Dry run only
        if: github.event_name != 'release'
        run: echo "Not a release - everything ran except the publish."
