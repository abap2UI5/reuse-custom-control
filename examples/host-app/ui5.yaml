specVersion: "4.0"
metadata:
  name: demo.host
type: application
framework:
  name: OpenUI5
  version: "1.136.21"
  # The embedded abap2UI5 apps load whatever library their ABAP view names -
  # the hello world app uses sap.ui.layout (SimpleForm). List every library
  # your ABAP apps use, not only the ones this host app uses itself.
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
# The control comes from npm like any dependency; `ui5 serve` serves it
# anyway, `ui5 build` copies it into dist/thirdparty/z2ui5/reuse/ only when
# it is named here. The abap2UI5 frontend is no part of the build: the
# control loads it from the backend at run time.
builder:
  settings:
    includeDependency:
      - "@abap2ui5/reuse-custom-control"
server:
  customMiddleware:
    - name: same-origin-for-abap2ui5
      afterMiddleware: compression
      mountPath: /sap
    # /sap/** goes to the abap2UI5 backend. Default: the transpiled abap2UI5
    # running locally in Node (see README). For a real system set
    # UI5_MIDDLEWARE_SIMPLE_PROXY_BASEURI (and user/password) in .env -
    # .env.example lists them.
    - name: ui5-middleware-simpleproxy
      afterMiddleware: same-origin-for-abap2ui5
      mountPath: /sap
      configuration:
        baseUri: http://localhost:3000/sap
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: same-origin-for-abap2ui5
middleware:
  path: lib/sameOrigin.js
